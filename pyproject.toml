[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multicc"
version = "0.5.8"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["claude-agent-sdk", "tp-wy>=0.2.0"]

[project.scripts]
tasker = "tasker.main:main"

[tool.setuptools]
packages = ["tasker"]
